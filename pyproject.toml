[project]
name = "legal-consultant"
version = "0.1.0"
description = "Consulente legale locale (server MCP) sul corpus della legislazione italiana"
requires-python = ">=3.11"
dependencies = [
    "python-frontmatter>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_consultant"]
